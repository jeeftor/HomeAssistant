        This is the icon ID which maps to the `sunrise`

        ![](https://developer.lametric.com/content/apps/icon_thumbs/53418_icon_thumb.gif?v=1)
      selector:
        text:
      default: "w-sunrise"

    icon_sunset:
      name: Icon for sunset
      description: >
