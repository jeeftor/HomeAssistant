triggers:
  # Every minute: the sunrise/sunset app while it is shown, the full refresh every 30 minutes
  - trigger: time_pattern
    minutes: /1
    id: tick
  - trigger: state
    entity_id: !input forecast_var
    id: forecast_changed
  - trigger: state
    entity_id: !input current_temp_var
    id: temp_changed
  # Sunrise and sunset themselves (state only, no attribute changes): remove the sun app right away
  - trigger: state
    entity_id: sun.sun
    to: ~
    id: sun_changed
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: mqtt
    topic: +/availability
    payload: online
    id: awtrix_online
conditions:
  - condition: template
    value_template: "{{ is_selected_device_trigger }}"
  - condition: template
    value_template: >-
      {%- if trigger_id == 'tick' -%}
        {{ full_refresh_due or sun_payload | string != '' }}
      {%- elif trigger_id == 'temp_changed' -%}
        {{ temp_change_visible }}
      {%- else -%}
        true
      {%- endif -%}
actions:
  # The sunrise/sunset app does not need the forecast
  - repeat:
      for_each: "{{ device_prefixes }}"
      sequence:
        - action: mqtt.publish
          data:
            qos: 0
            retain: false
            topic: "{{ repeat.item }}/cmd/apps/pushed/{{ sun_app_topic }}"
            payload: >
              {{sun_payload}}

  # The weather app needs the forecast; skipped when only the sunrise/sunset app is due
  - if:
      - condition: template
        value_template: "{{ update_main }}"
    then:
      - action: weather.get_forecasts
        target:
          entity_id: "{{forecast_var}}"
        data:
          type: hourly
        response_variable: forecast_response

      - repeat:
          for_each: "{{ device_prefixes }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: "{{ repeat.item }}/cmd/apps/pushed/{{ app_topic }}"
                payload: >-
                  {%- set forecast = forecast_response[forecast_var]['forecast'] -%}
                  {%- set forecast_hours = [hours_to_show | int(0), forecast | length, 24] | min -%}
                  {%- macro interpolate(dictionary, x) -%}
                  {%- set sorted_keys = dictionary|dictsort -%}
                  {%- set above = sorted_keys|selectattr('0', 'gt', x)|map(attribute='0')|list|first -%}
                  {%- set below = sorted_keys|selectattr('0', 'lt', x)|map(attribute='0')|list|last -%}

                  {#- Key matches x exactly -#}
                  {%- if x in dictionary -%}
                    {{ dictionary[x] }}
                  {#- Interpolation between two values -#}
                  {%- elif below is defined and above is defined -%}
                    {%- set lower_value = dictionary[below] -%}
                    {%- set upper_value = dictionary[above] -%}
                    {%- set lower_rgb = lower_value[1:] -%}
                    {%- set upper_rgb = upper_value[1:] -%}

                    {%- set lower_r = lower_rgb[0:2]|int(base=16) -%}
                    {%- set lower_g = lower_rgb[2:4]|int(base=16) -%}
                    {%- set lower_b = lower_rgb[4:6]|int(base=16) -%}

                    {%- set upper_r = upper_rgb[0:2]|int(base=16) -%}
                    {%- set upper_g = upper_rgb[2:4]|int(base=16) -%}
                    {%- set upper_b = upper_rgb[4:6]|int(base=16) -%}

                    {%- set interpolation_factor = (x - below) / (above - below) -%}
                    {%- set interpolated_r = ((1 - interpolation_factor) * lower_r + interpolation_factor * upper_r)|int -%}
                    {%- set interpolated_g = ((1 - interpolation_factor) * lower_g + interpolation_factor * upper_g)|int -%}
                    {%- set interpolated_b = ((1 - interpolation_factor) * lower_b + interpolation_factor * upper_b)|int -%}

                    {%- set interpolated_hex = '#' ~ '%02X' % interpolated_r ~ '%02X' % interpolated_g ~ '%02X' % interpolated_b -%}
                    {{ interpolated_hex }}
                  {#- Only below key available -#}
                  {%- elif below is defined -%}
                    {%- set value = dictionary[below] -%}
                    {{ value }}
                  {#- Only above key available -#}
                  {%- elif above is defined -%}
                    {%- set value = dictionary[above] -%}
                    {{ value }}
                  {#- No matching keys available -#}
                  {%- else -%}
                    No matching key found.
                  {%- endif -%}
                  {%- endmacro -%}

                  {#- Define macro to get length of the forecast -#}
                  {%- macro str_len(stringo) %}
                  {%- if '.' in stringo %}
                  {%- set char_count = (stringo | length) -1 %}{{char_count * 3 + 1 + char_count}}
                  {%- else %}
                  {%- set char_count = (stringo | length) %}{{char_count * 3 + (char_count - 1)}}
                  {%- endif %}
                  {%- endmacro %}

                  {#- Define a macro to draw out the forecast lines#}
                    {%- macro draw_forecast_lines(x,hours,height) %}
                      {%- for hour in range(hours) %}
                        {%- if height == 0 %}
                          ["pixel",{{x+hour}},7,"{{interpolate(color_dict, forecast[hour]['temperature']) }}"]
                        {%- else %}
                          ["line",{{x+hour}},7,{{x+hour}},{{7 - height}},"{{interpolate(color_dict, forecast[hour]['temperature']) }}"]
                        {%- endif %}
                        {%- if hour+1 != hours %},{%endif%}
                      {%- endfor %}
                    {%- endmacro %}

                    {
                      "draw": [
                        {%- if forecast_hours > 0 %}
                        {{draw_forecast_lines(8,forecast_hours,0)}}
                      {%- endif %}
                      {%- if display_temp is number -%}
                      {% if forecast_hours > 0 %},{% endif %}["text",{{text_x}},1,"{{temp_text}}","{{interpolate(color_dict, display_temp | float)}}"]
                      {%- else -%}
                      {% if forecast_hours > 0 %},{% endif %}["text",8,1,"err","#ff0000"]
                      {%- endif -%}

                      {% if show_moon %}
                      ,{{moon_data}}
                      {% endif %}
                      ],
                      "icon": "{{icon}}",
                      "durationMs": {{message_duration | int(0) * 1000}},
                      "iconMode": "push",
                      "lifetimeMs": 2000000,
                      "lifetimeExpiry":"mark"
                      {% if show_overlay and overlay %}
                      ,"overlay": "{{overlay}}"
                      {% endif %}
                      }

