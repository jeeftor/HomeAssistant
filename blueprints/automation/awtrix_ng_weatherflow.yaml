        ![](https://developer.lametric.com/content/apps/icon_thumbs/53417_icon_thumb.gif?v=1)
      selector:
        text:
      default: "w-sunset"
mode: queued
max: 10
max_exceeded: silent
variables:
  trigger_id: "{{ trigger.id if trigger is defined and trigger.id is defined else 'manual' }}"
  # Every 30 minutes, or for any trigger other than the minute tick and sunrise/sunset
  full_refresh_due: "{{ now().minute % 30 == 0 }}"
  update_main: >-
    {{ trigger_id not in ['tick', 'sun_changed'] or (trigger_id == 'tick' and full_refresh_due) }}
  device_ids: !input awtrix
  app_topic: jeef_weather
  sun_app_topic: jeef_weather_sun
  device_prefixes: >-
    {%- set result = namespace(items=[]) -%}
    {%- for device_id in device_ids -%}
      {%- set prefix_entities = device_entities(device_id) | select('search', 'mqtt_prefix') | list -%}
      {%- if prefix_entities | length > 0 -%}
        {%- set prefix = states(prefix_entities | first) -%}
        {%- if prefix not in ['unknown', 'unavailable', 'none', ''] -%}
          {%- set result.items = result.items + [prefix] -%}
        {%- endif -%}
      {%- endif -%}
    {%- endfor -%}
    {{ result.items | unique | list }}

  # Ignore availability messages of clocks that were not selected in the blueprint
  is_selected_device_trigger: >-
    {{
      trigger is not defined
      or trigger.id != 'awtrix_online'
      or trigger.topic | regex_replace('/availability$', '') in device_prefixes
    }}

  #---------------------------------
  # Weather Variables
  #---------------------------------
  forecast_var: !input forecast_var
  current_condition: "{{states(forecast_var)}}"
  current_temp: "{{state_attr(forecast_var,'temperature')}}"

  # Forecast hours to show
  hours_to_show: !input hours_to_show

  #---------------------------------
  # Moon Stuff
  #---------------------------------

  moon: !input moon
  moon_phase: "{{states(moon)}}"
  moon_times: !input moon_rise_set
  moon_rise: "{{state_attr(moon_times,'moonrise')}}"
  moon_set: "{{state_attr(moon_times,'moonset')}}"
  moon_alt: "{{state_attr(moon_times,'moon_altitude')}}"
  moon_risen: "{{ moon_alt | float(0) > 0 }}"
  when_show_moon: !input when_show_moon
  show_moon: >-
    {%- set valid_phase = moon_phase in [
      'first_quarter', 'full_moon', 'last_quarter', 'new_moon',
      'waning_crescent', 'waning_gibbous', 'waxing_crescent', 'waxing_gibbous'
    ] -%}
    {%- if when_show_moon == 'always' -%}
      {{ valid_phase }}
    {%- elif when_show_moon == 'never' -%}
      {{ false }}
    {%- elif when_show_moon == 'risen' -%}
      {{ valid_phase and moon_risen }}
    {%- else -%}
      {{ valid_phase and state_attr('sun.sun', 'elevation') | float(0) < 0 and moon_risen }}
    {%- endif -%}

  #----------------
  # Temp & Text
  # --------------
  message_duration: !input message_duration_forecast
  message_duration_riseset: !input message_duration_riseset
  current_temp_var: !input current_temp_var
  temp_digits: !input temp_digits
  temp_suffix: !input temp_suffix

  # One temperature for text and color: the selected sensor, otherwise the weather entity
  display_temp: >-
    {%- if is_number(states(current_temp_var)) -%}
      {{ states(current_temp_var) | float | round(temp_digits | int(0)) }}
    {%- elif is_number(current_temp) -%}
      {{ current_temp | float | round(temp_digits | int(0)) }}
    {%- endif -%}
  temp_text: >-
    {%- if display_temp is number -%}
      {{ display_temp ~ temp_suffix }}
    {%- else -%}
      err
    {%- endif -%}
  # Only react to a sensor change that alters the displayed (rounded) value
  temp_change_visible: >-
    {%- if trigger_id != 'temp_changed' -%}
      false
    {%- else -%}
      {%- set digits = temp_digits | int(0) -%}
      {%- set old = trigger.from_state.state if trigger.from_state else '' -%}
      {%- set new = trigger.to_state.state if trigger.to_state else '' -%}
      {%- set old_shown = old | float | round(digits) if is_number(old) else 'none' -%}
      {%- set new_shown = new | float | round(digits) if is_number(new) else 'none' -%}
      {{ old_shown != new_shown }}
    {%- endif -%}

  text_available_width: >
    {%- if show_moon %}16{%- else %}24{%- endif %}
  text_len: >-
    {%- macro get_text_len(string) %}
    {%- set length = namespace(value=0) %}
    {%- for char in string %}
      {%- if char.isdigit() %}
        {%- set length.value = length.value + 3 %}
      {%- elif char == '°' %}
        {%- set length.value = length.value + 2 %}
      {%- elif char == '.' %}
        {%- set length.value = length.value + 1 %}
      {%- elif char in ['-','C','F'] %}
        {%- set length.value = length.value + 3 %}
      {%- else %}
        {%- set length.value = length.value + 1 %}
      {%- endif %}
      {%- if not loop.last %}
        {%- set length.value = length.value + 1 %}{%- endif -%}
    {%- endfor -%}
    {{ length.value }}
    {%- endmacro %}

    {{get_text_len(temp_text)}}
  text_x: >-
    {{ (8 + ((text_available_width - text_len) / 2)) | round(0, 'floor') | int }}

  # ------------------------------
  # SUN THINGS
  # ------------------------------
  sun_event_minute_threshold: !input sun_event_minute_threshold
  sun_time_type: !input sun_time_type
  sun_time_format: !input sun_time_format
  icon_sunrise: !input icon_sunrise
  icon_sunset: !input icon_sunset
  show_sun_rise_set: !input show_sun_rise_set

  sun_next_event: >-
    {%- set rise = state_attr('sun.sun','next_rising') %}
    {%- set set = state_attr('sun.sun','next_setting') %}
    {%- set ts_rise = rise |as_timestamp %}
    {%- set ts_set = set |as_timestamp %}
    {{ iif(ts_set < ts_rise,'sunset','sunrise') }}

  sun_min_until_next_event: >-
    {%- set rise = state_attr('sun.sun','next_rising') %}
    {%- set set = state_attr('sun.sun','next_setting') %}
    {%- set ts_rise = rise |as_timestamp %}
    {%- set ts_set = set |as_timestamp %}
    {{ iif(sun_next_event == 'sunrise',(ts_rise - utcnow()|as_timestamp) / 60,(ts_set - utcnow()|as_timestamp) / 60) | round(0) }}

  sun_next_str: >-
    {%- set rise = state_attr('sun.sun','next_rising') %}
    {%- set set = state_attr('sun.sun','next_setting') %}
    {%- set ts_rise = rise |as_timestamp %}
    {%- set ts_set = set |as_timestamp %}
    {%- if sun_time_type == 'Actual' %}
      {{ iif(sun_next_event == 'sunrise',(ts_rise | as_datetime | as_local).strftime(sun_time_format),  (ts_set | as_datetime | as_local).strftime(sun_time_format)) }}
    {%- else %}
    {#- relative time below one hour; one hour or more uses colored fragments in sun_event_payload #}
      {{ sun_min_until_next_event | int(0) }} min
    {%- endif %}
  sun_event_icon: >-
    {{ iif(sun_next_event == 'sunrise', icon_sunrise, icon_sunset) }}
  sun_event_payload: >-
    {%- set minutes = sun_min_until_next_event | int(0) -%}
    {%- if sun_time_type != 'Actual' and minutes >= 60 -%}
      {%- set text = [
        {'text': (minutes // 60) | string, 'color': '#ffffff'},
        {'text': 'h', 'color': '#9c9d97'},
        {'text': (minutes % 60) | string, 'color': '#ffffff'},
        {'text': 'm', 'color': '#9c9d97'}
      ] -%}
    {%- else -%}
      {%- set text = sun_next_str | string | trim -%}
    {%- endif -%}
    {{
      {
        'icon': sun_event_icon,
        'text': text,
        'durationMs': message_duration_riseset | int(0) * 1000
      } | tojson
    }}
  sun_payload: >-
    {%- if show_sun_rise_set and sun_event_minute_threshold >= sun_min_until_next_event -%}
      {{ sun_event_payload }}
    {%- endif -%}

  # ------------------------------
  # Icons&Stuff
  # ------------------------------

  icon_clear_night: !input icon_clear_night
  use_moon_clear_night: !input use_moon_clear_night
  use_moon_sunny_night: !input use_moon_sunny_night
  icon_cloudy: !input icon_cloudy
  icon_exceptional: !input icon_exceptional
  icon_fog: !input icon_fog
  icon_hail: !input icon_hail
  icon_lightning: !input icon_lightning
  icon_lightning_rainy: !input icon_lightning_rainy
  icon_partlycloudy: !input icon_partlycloudy
  icon_pouring: !input icon_pouring
  icon_rainy: !input icon_rainy
  icon_snowy: !input icon_snowy
  icon_snowy_rainy: !input icon_snowy_rainy
  icon_sunny: !input icon_sunny
  icon_windy: !input icon_windy
  icon_windy_variant: !input icon_windy_variant
  clear_night_dict: >-
    {{ dict({
      'full_moon': '2314',
      'waning_gibbous': '2315',
      'last_quarter': '2316',
      'waning_crescent': '2317',
      'new_moon': '2318',
      'waxing_crescent': '2319',
      'first_quarter': '2320',
      'waxing_gibbous': '2321'}) }}
  color_matrix_json: !input color_matrix_json
  color_dict: >-
    {% set b = color_matrix_json | from_json %}    
    {%- set ns = namespace(tuples=[]) %}
    {%- for k,v in b | items -%}
      {%- set key = k|float -%}
      {%- set ns.tuples = ns.tuples + [(key,v)] %}      
    {% endfor %}
    {{ dict.from_keys(ns.tuples) }}

  icon_dict: >-
    {{ dict({'clear-night': icon_clear_night,
    'cloudy': icon_cloudy,
    'exceptional': icon_exceptional,
    'fog': icon_fog,
    'hail': icon_hail,
    'lightning': icon_lightning,
    'lightning-rainy': icon_lightning_rainy,
    'partlycloudy': icon_partlycloudy,
    'pouring': icon_pouring,
    'rainy': icon_rainy,
    'snowy': icon_snowy,
    'snowy-rainy': icon_snowy_rainy,
    'sunny': icon_sunny,
    'windy': icon_windy, 
    'windy-variant': icon_windy_variant})}}

  #--------------
  # Weather Icon
  #--------------
  icon: >
    {%- if ((current_condition == 'clear-night') and use_moon_clear_night) %}
      {{clear_night_dict.get(moon_phase, icon_clear_night)}}
    {%- elif (sun_next_event == 'sunrise') and use_moon_sunny_night and (current_condition == 'sunny') -%}
      
    {%- else %}
      {{ icon_dict.get(current_condition, icon_exceptional) }}
    {%- endif %}

  #--------------
  # Weather Overlay
  #--------------
  overlay_dict: >-
    {{ dict({'clear-night': '',
    'cloudy': '',
    'exceptional': '',
    'fog': '',
    'hail': 'frost',
    'lightning': 'thunder',
    'lightning-rainy': 'thunder',
    'partlycloudy': '',
    'pouring': 'storm',
    'rainy': 'drizzle',
    'rain': 'rain',
    'snowy': 'snow',
    'snowy-rainy': 'snow',
    'sunny': '',
    'windy': '', 
    'windy-variant': ''})}}
  overlay: >
    {{ overlay_dict.get(current_condition, '') }}
  show_overlay_input: !input show_overlay
  show_overlay: >
    {{ (show_overlay_input) == 'true' }}

