blueprint:
  name: Camera 📷️ Snapshot on sensor 🔘️
  description:
    "This automation blueprint creates a camera snapshot if motion is detected  and
    sends a notification to your phone with the picture.
    "

  domain: automation
  input:
    sensor:
      name: Sensor
      description: The sensor wich triggers the snapshot creation
      selector:
        entity:
          domain:
            - binary_sensor
          multiple: false
    camera:
      name: Camera
      description: The camera which creates the snapshot
      selector:
        entity:
          domain:
            - camera
          multiple: false
    notify_device:
      name: Device to notify
      description:
        Device needs to run the official Home Assistant app to receive
        notifications
      selector:
        device:
          integration: mobile_app
          multiple: false
    is_ios:
      name: Is it an iOS device?
      description: Toggle if your selected device runs iOS, default is Android
      selector:
        boolean: {}
      default: false
    notification_title:
      name: Notification title (Optional)
      description: 'Default: "Motion detected!"'
      default: Motion detected!
    notification_message:
      name: Notification message (Optional)
      description: 'Default: "{{ sensor_name }} detected movement!"'
      default: "{{ sensor_name }} detected movement!"
    delay:
      name: Delay (Optional)
      description: Wait before creating camera snapshot
      default: ""
      selector:
        number:
          min: 0.0
          max: 60.0
          unit_of_measurement: seconds
          mode: slider
          step: 1.0
  source_url: https://community.home-assistant.io/t/send-camera-snapshot-notification-on-motion/254565
trigger:
  platform: state
  entity_id: !input sensor
  from: "off"
  to: "on"
variables:
  sensor: !input sensor
  sensor_name: "{{ states[sensor].name }}"
  camera: !input camera
  notify_device: !input notify_device  
  notification_title: !input notification_title
  notification_message: !input notification_message
  delay: !input delay
  snapshot_create_file_path:
    /config/www/tmp/snapshot_{{ states[camera].object_id
    }}.jpg
  snapshot_access_file_path: >-
    {{ snapshot_create_file_path | replace('/config/www','/local')}}

condition: []
action:
  []
