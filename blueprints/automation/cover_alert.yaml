blueprint:
  name: Garage Door Monitor
  description: Actionable notifications on cover being open too long
  domain: automation
  input:
    cover:
      name: Garage Door (cover)
      selector:
        entity:
          domain: cover
    notify_device:
      name: Device to notify
      description: Device needs to run the official Home Assistant app to receive notifications
      selector:
        device:
          integration: mobile_app

variables:
  cover: !input cover
  notification_devices: !input notify_devices
  time_open: >
    {% set duration = trigger.for if trigger.platform == 'state' else None %}
    {% if duration %}
      {{ (duration.days * 24 * 60) + (duration.seconds // 60) }}
    {% else %}
      0
    {% endif %}
trigger:
  - platform: state
    entity_id: !input cover
    to: "open"
    for: "00:00:10" # 10 seconds
    id: "open"
  - platform: state
    entity_id: !input cover
    to: "open"
    for: "00:01:00" # 1 minutes
    id: "open"
  - platform: state
    entity_id: !input cover
    to: "open"
    for: "00:30:00" # 30 minutes
    id: "open"
  - platform: state
    entity_id: !input cover
    to: "open"
    for: "01:00:00" # 1 hour
    id: "open"
  - platform: state
    entity_id: !input cover
    to: "open"
    for: "01:30:00" # 1.5 hours
    id: "open"
  - platform: state
    entity_id: !input cover
    to: "open"
    for: "02:00:00" # 2 hours
    id: "open"
  - platform: state
    entity_id: !input cover
    to: "open"
    for: "02:30:00" # 2.5 hours
    id: "open"
  - platform: state
    entity_id: !input cover
    to: "open"
    for: "03:00:00" # 3 hours
    id: "open"
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: "CLOSE_GARAGE"

action:
  - choose:
      - conditions: "{{ trigger.id == 'open' }}"
        sequence:
          - repeat:
              count: "{{ notification_devices | count }}"
              sequence:
                - device_id: !input notify_device
                  domain: mobile_app
                  type: notify
                  message: "Garage door has been open for {{ time_open }}"
                  data:
                    actions:
                      - action: "CLOSE_GARAGE"
                        title: "Close Garage"
                      - action: "DISMISS"
                        title: "Dismiss"
      - conditions: "{{ trigger.platform == 'event' and trigger.event.event_type == 'mobile_app_notification_action' and trigger.event.data.action == 'CLOSE_GARAGE' }}"
        sequence:
          - service: cover.close_cover
            target:
              entity_id: "{{ cover }}"
mode: restart
