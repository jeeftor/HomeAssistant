---
blueprint:
  name: Status 🚥️ Light - Sensor Monitor
  description: >
    This blueprint is designed to monitor 1-2 sensors and toggle a light based on the statuses

  domain: automation
  input:
    lights:
      name: Status Light(s)
      description: Select the lights to show status
      selector:
        entity:
          domain: light
          multiple: true

    trigger_sensor_1:
      name: Sensor 1
      description: Binary sensor to track status of something like a door or
      selector:
        entity:
          domain:
            - binary_sensor
            - cover
            - lock
            - input_boolean

    # trigger_sensor_2:
    #   name: Sensor 2 (optional)
    #   description: A secondary sensor (like a lock) that you want to pair with the first sensor
    #   selector:
    #     entity:
    #       domain:
    #         - binary_sensor
    #         - cover
    #         - lock
    #         - input_boolean
    # use_sensor_2:
    #   name: Use the second sensor
    #   description: Main use case is if sensor 2 is a lock
    #   selector:
    #     boolean:
    #   default: false
    on_color_1:
      name: Sensor 1 engaged color (Sensor 2 off)
      description: >-
        This is the color if the first Sensor is engaged. Say you have a motion sensor and it detects motion. Or if a door is open
      selector:
        color_rgb:
      default: [255, 0, 0]
    error_color_1:
      name: Sensor 1 Error Color
      description: >-
        This will usually show if the entity in Sensor 1 is not available
      selector:
        color_rgb:
      default: [255, 0, 255]

    off_color_1:
      name: Sensor 1 disengaged
      description: >-
        This is the color if the first Sensor is engaged. Say you have a motion sensor and it detects motion. Or if a door is open
      selector:
        color_rgb:
      default: [0, 0, 0]

mode: queued
max: 10

