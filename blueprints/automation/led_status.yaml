trigger_variables:
  sensor1: !input trigger_sensor_1
  # sensor2: !input trigger_sensor_2
  on_state: "{{['on','open','unlocked']}}"
  to_on_state: "{{['unlocking','opening']}}"
  to_off_state: "{{['locking','closing']}}"
  off_state: "{{['off','closed','locked']}}"
  non_error_states: "{{ on_state + to_on_state + to_off_state + off_state }}"

trigger:
  # - platform: time_pattern
  #   minutes: /1
  #   id: time
  - platform: template
    id: "on"
    value_template: "{{ states(trigger_sensor_1) in on_state }}"
  - platform: template
    id: "to_on"
    value_template: "{{ states(trigger_sensor_1) in to_on_state }}"
  - platform: template
    value_template: "{{ states(trigger_sensor_1) in off_state }}"
    id: "off"
  - platform: template
    value_template: "{{ states(trigger_sensor_1) in to_off_state }}"
    id: "to_off"
  - platform: template
    value_template: "{{ states(trigger_sensor_1) not in non_error_states }}"
    id: error

condition: []
action:
