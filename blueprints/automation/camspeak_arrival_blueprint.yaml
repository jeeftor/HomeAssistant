blueprint:
  name: Camspeak Announcement on Arrival
  description: 'Play a camspeak audio preset on a camera speaker when a device tracker
    arrives home within a specified time window.

    '
  domain: automation
  author: jstein
  homeassistant:
    min_version: 2024.10.0
  input:
    tracker:
      name: Device Tracker
      description: The person/device tracker to watch for arrival home.
      selector:
        entity:
          domain:
          - device_tracker
          multiple: false
          reorder: false
    camera_speaker:
      name: Camspeak Speaker
      description: The camspeak media_player entity to play the preset on.
      selector:
        entity:
          integration: camspeak
          domain:
          - media_player
          multiple: false
          reorder: false
    play_mode:
      name: Play Mode
      description: Play a saved preset or speak text via TTS.
      default: preset
      selector:
        select:
          multiple: false
          options:
          - label: Play Preset
            value: preset
          - label: Speak TTS
            value: tts
          sort: false
          custom_value: false
    preset:
      name: Preset
      description: Pick a preset from the camspeak media library (used when Play Mode
        = Play Preset).
      selector:
        media:
          multiple: false
    tts_text:
      name: TTS Text
      description: Text to speak via camspeak's Kokoro TTS engine (used when Play
        Mode = Speak TTS).
      default: ''
      selector:
        text:
          multiple: false
          multiline: true
    start_time:
      name: Start Time
      description: Beginning of the active time window.
      selector:
        time: {}
    end_time:
      name: End Time
      description: End of the active time window.
      selector:
        time: {}
    weekdays:
      name: Days of Week
      description: Which days the automation is active.
      default:
      - mon
      - tue
      - wed
      - thu
      - fri
      selector:
        select:
          multiple: true
          options:
          - label: Monday
            value: mon
          - label: Tuesday
            value: tue
          - label: Wednesday
            value: wed
          - label: Thursday
            value: thu
          - label: Friday
            value: fri
          - label: Saturday
            value: sat
          - label: Sunday
            value: sun
          sort: false
          custom_value: false
  source_url: https://kb.vookie.net/5c672mazo7ft/camspeak_arrival_blueprint.yaml
mode: single
triggers:
- trigger: state
  entity_id: !input tracker
  from: not_home
  to: home
conditions:
- condition: time
  after: !input start_time
  before: !input end_time
  weekday: !input weekdays
variables:
  play_mode: !input play_mode
actions:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ play_mode == ''preset'' }}'
    sequence:
    - action: media_player.play_media
      target:
        entity_id: !input camera_speaker
      data:
        media_content_id: !input preset
        media_content_type: music
  - conditions:
    - condition: template
      value_template: '{{ play_mode == ''tts'' }}'
    sequence:
    - action: camspeak.speak
      target:
        entity_id: !input camera_speaker
      data:
        text: !input tts_text
